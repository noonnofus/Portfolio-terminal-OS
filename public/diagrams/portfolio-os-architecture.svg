<svg id="portfolio-os-architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Portfolio OS architecture</title>
  <desc id="description">A diagram connecting the terminal and GUI shell to navigation state, browser history, directory interactions, content, and preferences.</desc>
  <rect width="1600" height="780" fill="#ffffff"/>
  <style>
    .node { stroke-width: 2; rx: 12; }
    .shell { fill: #e8f0fe; stroke: #2563eb; }
    .state { fill: #ecfdf5; stroke: #059669; }
    .browser { fill: #fff7ed; stroke: #ea580c; }
    .data { fill: #f5f3ff; stroke: #7c3aed; }
    .label { fill: #172554; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 25px; font-weight: 650; text-anchor: middle; }
    .sub { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; text-anchor: middle; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <path class="line" d="M 160 240 V 340"/>
  <path class="line" d="M 265 410 H 325 V 275 H 380"/>
  <path class="line" d="M 590 275 V 340"/>
  <path class="line" d="M 590 465 H 800 V 400 H 930"/>
  <path class="line" d="M 1140 400 H 1260"/>
  <path class="line" d="M 590 465 V 625 H 930"/>
  <path class="line" d="M 1140 625 V 565 H 1260"/>
  <path class="line" d="M 1140 625 V 695 H 1260"/>

  <rect class="node shell" x="55" y="100" width="210" height="140"/>
  <text class="label" x="160" y="157">Terminal</text>
  <text class="sub" x="160" y="192">entry</text>

  <rect class="node shell" x="55" y="340" width="210" height="140"/>
  <text class="label" x="160" y="397">GUI shell</text>
  <text class="sub" x="160" y="432">desktop and windows</text>

  <rect class="node state" x="380" y="205" width="210" height="140"/>
  <text class="label" x="485" y="262">Navigation</text>
  <text class="label" x="485" y="293">planner</text>

  <rect class="node state" x="380" y="400" width="210" height="130"/>
  <text class="label" x="485" y="457">GUI store</text>

  <rect class="node browser" x="930" y="335" width="210" height="130"/>
  <text class="label" x="1035" y="392">Browser</text>
  <text class="sub" x="1035" y="426">adapter</text>

  <rect class="node browser" x="1260" y="335" width="260" height="130"/>
  <text class="label" x="1390" y="392">URL and</text>
  <text class="label" x="1390" y="423">History API</text>

  <rect class="node shell" x="930" y="560" width="210" height="130"/>
  <text class="label" x="1035" y="617">DirectorySurface</text>

  <rect class="node shell" x="1260" y="525" width="260" height="80"/>
  <text class="label" x="1390" y="575">Desktop</text>
  <rect class="node shell" x="1260" y="655" width="260" height="80"/>
  <text class="label" x="1390" y="705">Projects folder</text>

  <rect class="node data" x="660" y="70" width="220" height="100"/>
  <text class="label" x="770" y="112">Content and</text>
  <text class="sub" x="770" y="144">locale</text>
  <rect class="node data" x="930" y="70" width="210" height="100"/>
  <text class="label" x="1035" y="112">Preferences</text>
  <text class="sub" x="1035" y="144">language and appearance</text>
</svg>
