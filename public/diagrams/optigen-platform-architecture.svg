<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">B2B AICC platform architecture</title>
  <desc id="description">The user interface connects to the Spring Boot API, which coordinates application data and the AI service. The AI service connects to retrieval, language models, and MCP business tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .box-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .box-ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .box-data { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .line-secondary { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .title { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 36px; font-weight: 700; }
      .label { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 32px; font-weight: 700; }
      .body { fill: #475569; font-family: Inter, system-ui, sans-serif; font-size: 24px; }
      .caption { fill: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text class="title" x="60" y="70">B2B AICC product flow</text>
  <text class="body" x="60" y="110">Core product responsibilities and external integrations</text>

  <rect class="box" x="55" y="325" width="220" height="150" rx="18"/>
  <text class="label" x="165" y="382" text-anchor="middle">Users</text>
  <text class="body" x="165" y="416" text-anchor="middle">Administrators</text>
  <text class="body" x="165" y="445" text-anchor="middle">AI chat users</text>

  <rect class="box-accent" x="360" y="270" width="360" height="260" rx="22"/>
  <text class="caption" x="400" y="316">PRODUCT FRONTEND</text>
  <text class="label" x="400" y="360">Next.js application</text>
  <text class="body" x="400" y="415">Administration and AI chat</text>
  <text class="body" x="400" y="457">Auth, server data, UI state</text>
  <text class="body" x="400" y="499">Responsive and accessible UI</text>

  <rect class="box" x="820" y="310" width="300" height="180" rx="20"/>
  <text class="caption" x="860" y="354">APPLICATION API</text>
  <text class="label" x="860" y="398">Spring Boot API</text>
  <text class="body" x="860" y="440">Auth, organizations</text>
  <text class="body" x="860" y="475">Bots, documents, history</text>

  <rect class="box-ai" x="1230" y="310" width="310" height="180" rx="20"/>
  <text class="caption" x="1270" y="354">AI SERVICE</text>
  <text class="label" x="1270" y="398">RAG and LLM</text>
  <text class="body" x="1270" y="440">Retrieval, streaming responses</text>

  <rect class="box-data" x="820" y="650" width="300" height="125" rx="18"/>
  <text class="label" x="970" y="704" text-anchor="middle">MySQL</text>
  <text class="body" x="970" y="744" text-anchor="middle">Product and chat data</text>

  <rect class="box-data" x="1200" y="650" width="230" height="125" rx="18"/>
  <text class="label" x="1315" y="704" text-anchor="middle">Qdrant</text>
  <text class="body" x="1315" y="744" text-anchor="middle">Vector retrieval</text>

  <rect class="box-data" x="1460" y="650" width="110" height="125" rx="18"/>
  <text class="label" x="1515" y="704" text-anchor="middle">LLM</text>
  <text class="body" x="1515" y="744" text-anchor="middle">Models</text>

  <rect class="box-ai" x="1230" y="95" width="310" height="135" rx="20"/>
  <text class="caption" x="1270" y="138">INTEGRATED TOOLS</text>
  <text class="label" x="1270" y="181">MCP business tools</text>
  <text class="body" x="1270" y="218">Available inside AI chat</text>

  <path class="line" d="M275 400 H360"/>
  <path class="line" d="M720 400 H820"/>
  <path class="line" d="M1120 400 H1230"/>
  <path class="line-secondary" d="M970 490 V650"/>
  <path class="line-secondary" d="M1385 490 V570 H1315 V650"/>
  <path class="line-secondary" d="M1415 490 V585 H1515 V650"/>
  <path class="line-secondary" d="M1385 310 V230"/>
</svg>
